[package]
name = "meydoon"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2", features = [
    "sqlx-sqlite", "runtime-tokio-rustls", "macros",
    "with-uuid", "with-chrono",
    "schema-sync", "with-json", "entity-registry",
]}
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.6"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
